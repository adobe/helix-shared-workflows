name: AI review scripts
description: >-
  Puts the scripts, prompt and findings schema of the AI review workflow
  (.github/workflows/ai-review.yml) on the runner and exports their directory
  as AI_REVIEW. Its only caller is that workflow.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DIR: ${{ github.action_path }}
      run: echo "AI_REVIEW=$DIR" >> "$GITHUB_ENV"
