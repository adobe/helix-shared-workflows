name: Build
on: [push]

env:
  CI_BRANCH: ${{ github.ref_name }}

permissions:
  contents: write  # semantic-release-dry verifies the write permissions
  issues: read # needed by semantic-release
  pull-requests: write # needed by semantic-release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Lint the AI review scripts
        run: |
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck > /dev/null; }
          shellcheck .github/ai-review/*.sh .github/release/*.sh
          for script in .github/ai-review/*.mjs; do node --check "$script"; done
          node --test .github/ai-review/*.test.mjs
          jq empty .github/ai-review/findings-schema.json
      - name: Semantic Release (Dry Run)
        run: npm run semantic-release-dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release tags the version first and moves the major tag and creates the
      # GitHub release last. If it fails in between, a re-run finds the tag and releases
      # nothing. This step does the late part for whatever is missing, so a re-run of the
      # job completes a release that stopped half way.
      - name: Bring the major tag and the GitHub releases in line with the version tags
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force origin
          bash .github/release/repair.sh
